<!DOCTYPE html>
<html>
<head>
  <title>Menu</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 30px 20px;
      text-align: center;
      border-bottom: 2px solid #FFD700;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 70%);
      animation: glow 3s infinite;
    }

    @keyframes glow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50%       { transform: scale(1.1); opacity: 1; }
    }

    .header .emoji { font-size: 45px; }

    .header h1 {
      color: #FFD700;
      font-size: 26px;
      margin: 8px 0 4px 0;
      position: relative;
    }

    .header p {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      position: relative;
    }

    /* Scan instruction */
    .scan-tip {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      margin: 15px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }

    .scan-tip span {
      color: #FFD700;
      font-weight: bold;
    }

    /* Category title */
    .category-title {
      padding: 15px 20px 8px 20px;
      font-size: 12px;
      color: #FFD700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Dish card */
    .dish-card {
      margin: 8px 15px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 16px;
      border: 1px solid rgba(255,215,0,0.2);
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 12px;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      color: white;
    }

    .dish-card:active {
      transform: scale(0.98);
      border-color: #FFD700;
    }

    /* Dish photo thumbnail */
    .dish-thumb {
      width: 75px;
      height: 75px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid rgba(255,215,0,0.3);
      flex-shrink: 0;
      background: #333;
    }

    /* Dish info */
    .dish-info {
      flex: 1;
    }

    .dish-info h3 {
      font-size: 16px;
      color: white;
      margin-bottom: 4px;
    }

    .dish-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    /* Veg NonVeg badge */
    .badge-veg {
      background: rgba(0,200,0,0.2);
      border: 1px solid #00c800;
      color: #00c800;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: bold;
    }

    .badge-nonveg {
      background: rgba(200,0,0,0.2);
      border: 1px solid #ff4444;
      color: #ff4444;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Price */
    .dish-price {
      color: #90EE90;
      font-size: 16px;
      font-weight: bold;
    }

    /* Spice dots */
    .spice {
      display: flex;
      gap: 3px;
    }

    .spice-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
    }

    .spice-dot.hot { background: #ff4444; }

    /* Scan QR arrow */
    .scan-arrow {
      color: #FFD700;
      font-size: 20px;
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
    }

    /* Loading */
    #loading {
      text-align: center;
      padding: 50px;
      color: #FFD700;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="emoji">🍽️</div>
    <h1 id="rest-name">Loading...</h1>
    <p id="rest-tagline"></p>
  </div>

  <div class="scan-tip">
    📱 <span>Scan QR code</span> next to any dish
    to see full details and photo!
  </div>

  <div id="menu-container">
    <div id="loading">✨ Loading menu...</div>
  </div>

  <div class="footer">
    Powered by AR Menu • Scan each dish QR
  </div>

  <script>
    fetch('menu.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {

        // Set restaurant info
        document.getElementById('rest-name')
          .textContent = data.restaurant;
        document.getElementById('rest-tagline')
          .textContent = data.tagline;

        // Group dishes by category
        var categories = {};
        data.dishes.forEach(function(dish) {
          if (!categories[dish.category]) {
            categories[dish.category] = [];
          }
          categories[dish.category].push(dish);
        });

        // Build menu HTML
        var html = '';
        Object.keys(categories).forEach(function(cat) {
          html += '<div class="category-title">' + cat + '</div>';
          categories[cat].forEach(function(dish) {

            // Build spice dots
            var spiceDots = '';
            for (var i = 1; i <= 5; i++) {
              spiceDots += '<div class="spice-dot' +
                (i <= dish.spice ? ' hot' : '') +
                '"></div>';
            }

            // Veg badge
            var badge = dish.type === 'veg'
              ? '<span class="badge-veg">🟢 VEG</span>'
              : '<span class="badge-nonveg">🔴 NON VEG</span>';

            html += '<a class="dish-card" href="dish.html?id=' + dish.id + '">' +
              '<img class="dish-thumb" src="' + dish.photo + '" onerror="this.src=\'https://via.placeholder.com/75x75/1a1a2e/FFD700?text=🍽️\'">' +
              '<div class="dish-info">' +
                '<h3>' + dish.name + '</h3>' +
                '<div class="dish-meta">' +
                  badge +
                  '<div class="spice">' + spiceDots + '</div>' +
                '</div>' +
                '<div class="dish-price">₹' + dish.price + '</div>' +
              '</div>' +
              '<div class="scan-arrow">▶</div>' +
            '</a>';
          });
        });

        document.getElementById('menu-container').innerHTML = html;
      })
      .catch(function(e) {
        document.getElementById('loading').textContent =
          'Error loading menu. Please refresh.';
      });
  </script>

</body>
  </html>
