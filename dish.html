<!DOCTYPE html>
<html>
<head>
  <title>Dish Details</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #0a0a0a;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Back button */
    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #FFD700;
      color: #FFD700;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
      text-decoration: none;
      cursor: pointer;
    }

    /* Photo section */
    .photo-section {
      position: relative;
      width: 100%;
      height: 300px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-30px);
      transition: all 0.8s ease;
    }

    .photo-section.show {
      opacity: 1;
      transform: translateY(0);
    }

    .dish-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Dark overlay on photo */
    .photo-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(transparent, #0a0a0a);
    }

    /* Sparkle particles */
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFD700;
      animation: float 3s infinite;
      opacity: 0;
    }

    @keyframes float {
      0%   { transform: translateY(0) scale(0); opacity: 0; }
      50%  { opacity: 1; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }

    /* Content section */
    .content {
      padding: 20px;
      position: relative;
    }

    /* Dish name */
    .dish-name {
      font-size: 28px;
      font-weight: bold;
      color: white;
      opacity: 0;
      transform: translateX(-30px);
      transition: all 0.6s ease 0.3s;
      margin-bottom: 12px;
    }

    .dish-name.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Glow effect on name */
    .dish-name span {
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
    }

    /* Badges row */
    .badges-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      opacity: 0;
      transition: all 0.6s ease 0.5s;
    }

    .badges-row.show { opacity: 1; }

    .badge-veg {
      background: rgba(0,200,0,0.15);
      border: 1.5px solid #00c800;
      color: #00c800;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .badge-nonveg {
      background: rgba(200,0,0,0.15);
      border: 1.5px solid #ff4444;
      color: #ff4444;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .category-tag {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.4);
      color: #FFD700;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* Price */
    .price-section {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease 0.6s;
    }

    .price-section.show {
      opacity: 1;
      transform: translateY(0);
    }

    .price-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 4px;
    }

    .price-amount {
      font-size: 36px;
      font-weight: bold;
      color: #90EE90;
    }

    .price-amount span {
      font-size: 20px;
    }

    /* Spice meter */
    .spice-section {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      opacity: 0;
      transition: all 0.6s ease 0.7s;
    }

    .spice-section.show { opacity: 1; }

    .spice-label {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 10px;
    }

    .spice-bar {
      display: flex;
      gap: 6px;
    }

    .spice-dot {
      width: 35px;
      height: 10px;
      border-radius: 5px;
      background: #333;
      transition: background 0.3s;
    }

    .spice-dot.hot { background: #ff4444; }
    .spice-dot.medium { background: #FFA500; }

    .spice-text {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-top: 6px;
    }

    /* Ingredients */
    .ingredients-section {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      opacity: 0;
      transition: all 0.6s ease 0.8s;
    }

    .ingredients-section.show { opacity: 1; }

    .section-title {
      font-size: 13px;
      color: #FFD700;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .ingredient-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .ingredient-tag {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.3s;
    }

    .ingredient-tag.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Description */
    .description-section {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 30px;
      opacity: 0;
      transition: all 0.6s ease 0.9s;
    }

    .description-section.show { opacity: 1; }

    .description-section p {
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      line-height: 1.7;
    }

    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loading-emoji {
      font-size: 50px;
      animation: bounce 0.8s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-20px); }
    }

    .loading-text {
      color: #FFD700;
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loading-emoji">🍽️</div>
    <div class="loading-text">Preparing your dish...</div>
  </div>

  <!-- Back button -->
  <a class="back-btn" id="back-btn" href="index.html">
    ← Menu
  </a>

  <!-- Photo -->
  <div class="photo-section" id="photo-section">
    <img class="dish-photo" id="dish-photo" src="" alt="Dish"/>
    <div class="photo-overlay"></div>
  </div>

  <!-- Content -->
  <div class="content">

    <div class="dish-name" id="dish-name">
      <span id="name-text"></span>
    </div>

    <div class="badges-row" id="badges-row">
      <span id="type-badge"></span>
      <span class="category-tag" id="category-tag"></span>
    </div>

    <div class="price-section" id="price-section">
      <div class="price-label">PRICE</div>
      <div class="price-amount">
        <span>₹</span>
        <span id="price-display">0</span>
      </div>
    </div>

    <div class="spice-section" id="spice-section">
      <div class="spice-label">🌶️ Spice Level</div>
      <div class="spice-bar" id="spice-bar"></div>
      <div class="spice-text" id="spice-text"></div>
    </div>

    <div class="ingredients-section" id="ingredients-section">
      <div class="section-title">🥘 Ingredients</div>
      <div class="ingredient-tags" id="ingredient-tags"></div>
    </div>

    <div class="description-section" id="description-section">
      <div class="section-title">📝 About this dish</div>
      <p id="dish-description"></p>
    </div>

  </div>

  <script>
    // Get dish id from URL
    var params = new URLSearchParams(window.location.search);
    var dishId = parseInt(params.get('id'));

    // Spice level names
    var spiceNames = ['', 'Mild', 'Medium', 'Spicy', 'Very Spicy', 'Extra Hot 🔥'];

    // Animate price counting up
    function countUp(target, duration) {
      var start = 0;
      var step = target / (duration / 16);
      var timer = setInterval(function() {
        start += step;
        if (start >= target) {
          start = target;
          clearInterval(timer);
        }
        document.getElementById('price-display')
          .textContent = Math.floor(start);
      }, 16);
    }

    // Animate ingredients one by one
    function animateIngredients(ingredients) {
      var tags = document.querySelectorAll('.ingredient-tag');
      tags.forEach(function(tag, i) {
        setTimeout(function() {
          tag.classList.add('show');
        }, i * 150);
      });
    }

    // Create sparkle particles
    function createParticles() {
      var photo = document.getElementById('photo-section');
      for (var i = 0; i < 8; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.bottom = '20%';
        p.style.animationDelay = Math.random() * 2 + 's';
        p.style.animationDuration = (2 + Math.random() * 2) + 's';
        photo.appendChild(p);
      }
    }

    // Build spice bar
    function buildSpiceBar(level) {
      var bar = '';
      var color = level <= 2 ? 'medium' : 'hot';
      for (var i = 1; i <= 5; i++) {
        bar += '<div class="spice-dot' +
          (i <= level ? ' ' + color : '') +
          '"></div>';
      }
      document.getElementById('spice-bar').innerHTML = bar;
      document.getElementById('spice-text').textContent =
        level === 0
          ? 'No spice'
          : spiceNames[level] || 'Spicy';
    }

    // Load dish data
    fetch('menu.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {

        // Find the dish
        var dish = data.dishes.find(function(d) {
          return d.id === dishId;
        });

        if (!dish) {
          window.location.href = 'index.html';
          return;
        }

        // Set all content
        document.getElementById('dish-photo').src = dish.photo;
        document.getElementById('name-text').textContent = dish.name;
        document.getElementById('category-tag').textContent = dish.category;
        document.getElementById('dish-description').textContent = dish.description;

        // Veg badge
        document.getElementById('type-badge').innerHTML =
          dish.type === 'veg'
            ? '<span class="badge-veg">🟢 VEG</span>'
            : '<span class="badge-nonveg">🔴 NON VEG</span>';

        // Spice bar
        buildSpiceBar(dish.spice);

        // Ingredients
        var ingredientList = dish.ingredients.split(',');
        var tagsHtml = ingredientList.map(function(ing) {
          return '<span class="ingredient-tag">' +
            ing.trim() + '</span>';
        }).join('');
        document.getElementById('ingredient-tags')
          .innerHTML = tagsHtml;

        // Hide loading screen
        setTimeout(function() {
          document.getElementById('loading-screen')
            .style.display = 'none';

          // Start animations one by one
          setTimeout(function() {
            document.getElementById('photo-section')
              .classList.add('show');
            createParticles();
          }, 100);

          setTimeout(function() {
            document.getElementById('dish-name')
              .classList.add('show');
          }, 400);

          setTimeout(function() {
            document.getElementById('badges-row')
              .classList.add('show');
          }, 600);

          setTimeout(function() {
            document.getElementById('price-section')
              .classList.add('show');
            countUp(dish.price, 1000);
          }, 700);

          setTimeout(function() {
            document.getElementById('spice-section')
              .classList.add('show');
          }, 800);

          setTimeout(function() {
            document.getElementById('ingredients-section')
              .classList.add('show');
            setTimeout(animateIngredients, 200);
          }, 900);

          setTimeout(function() {
            document.getElementById('description-section')
              .classList.add('show');
          }, 1000);

        }, 1000);
      })
      .catch(function(e) {
        window.location.href = 'index.html';
      });
  </script>

</body>
  </html>
