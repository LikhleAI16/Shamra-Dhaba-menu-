<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dish Details</title>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #FFD700;
      --gold2: #FFA500;
      --purple: #1a0533;
      --purple2: #2d0a4e;
      --purple3: #3d1a5e;
      --card: rgba(45,10,78,0.9);
      --text: #f5f0ff;
      --subtext: rgba(245,240,255,0.6);
      --green: #00e676;
      --red: #ff5252;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--purple);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(100,0,180,0.3) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(180,0,100,0.2) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }

    /* Loading */
    #loading-screen {
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: var(--purple);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .load-emoji {
      font-size: 55px;
      animation: bounce 0.7s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-20px) scale(1.1); }
    }

    .load-text {
      color: var(--gold);
      margin-top: 20px;
      font-size: 15px;
      font-weight: 600;
    }

    .load-bar {
      width: 120px;
      height: 3px;
      background: rgba(255,215,0,0.2);
      border-radius: 3px;
      margin-top: 15px;
      overflow: hidden;
    }

    .load-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 3px;
      animation: loadfill 1s ease forwards;
    }

    @keyframes loadfill { from { width:0; } to { width:100%; } }

    /* Back button */
    .back-btn {
      position: fixed;
      top: 15px; left: 15px;
      background: rgba(26,5,51,0.85);
      border: 1px solid rgba(255,215,0,0.4);
      color: var(--gold);
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 99;
      text-decoration: none;
      backdrop-filter: blur(10px);
      font-family: 'Nunito', sans-serif;
    }

    /* Photo */
    .photo-wrap {
      position: relative;
      width: 100%;
      height: 290px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.9s cubic-bezier(0.22,1,0.36,1);
      z-index: 1;
    }

    .photo-wrap.show { opacity: 1; transform: translateY(0); }

    .dish-photo {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .photo-gradient {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 65%;
      background: linear-gradient(transparent, var(--purple));
    }

    /* Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: floatup 3s ease-out infinite;
      opacity: 0;
    }

    @keyframes floatup {
      0%   { transform: translateY(0) scale(0); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateY(-120px) scale(0.5); opacity: 0; }
    }

    /* Badges on photo */
    .photo-badges {
      position: absolute;
      top: 55px; right: 15px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-end;
    }

    .badge-chef {
      background: linear-gradient(135deg, #FF6B35, #FF4500);
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .badge-best {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #1a0533;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
    }

    .badge-new {
      background: linear-gradient(135deg, #00e676, #00b0ff);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
    }

    /* Content */
    .content {
      padding: 10px 18px 40px;
      position: relative;
      z-index: 1;
    }

    /* Name */
    .dish-name {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      color: white;
      opacity: 0;
      transform: translateX(-25px);
      transition: all 0.7s cubic-bezier(0.22,1,0.36,1) 0.2s;
      margin-bottom: 12px;
      line-height: 1.2;
      text-shadow: 0 0 30px rgba(255,215,0,0.2);
    }

    .dish-name.show { opacity: 1; transform: translateX(0); }

    /* Badges row */
    .badges-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      opacity: 0;
      transition: opacity 0.6s ease 0.4s;
    }

    .badges-row.show { opacity: 1; }

    .veg-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
    }

    .veg { background: rgba(0,230,118,0.12); border: 1.5px solid var(--green); color: var(--green); }
    .nonveg { background: rgba(255,82,82,0.12); border: 1.5px solid var(--red); color: var(--red); }

    .cat-tag {
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
    }

    /* Cards */
    .info-card {
      background: var(--card);
      border: 1px solid rgba(255,215,0,0.15);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 14px;
      opacity: 0;
      transform: translateY(18px);
      transition: all 0.6s cubic-bezier(0.22,1,0.36,1);
      backdrop-filter: blur(10px);
    }

    .info-card.show { opacity: 1; transform: translateY(0); }

    .card-label {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* Price */
    .price-val {
      font-size: 42px;
      font-weight: 800;
      color: #90EE90;
      font-family: 'Playfair Display', serif;
    }

    .price-val span { font-size: 22px; }

    /* Ratings */
    .rating-big {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .rating-num {
      font-size: 36px;
      font-weight: 800;
      color: var(--gold);
      font-family: 'Playfair Display', serif;
    }

    .rating-right { flex: 1; }

    .stars-big { display: flex; gap: 3px; margin-bottom: 4px; }
    .star-big { font-size: 20px; color: rgba(255,255,255,0.15); }
    .star-big.filled { color: var(--gold); }

    .rating-count-big { font-size: 12px; color: var(--subtext); }

    /* Reviews */
    .review-item {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
      opacity: 0;
      transform: translateX(-15px);
      transition: all 0.4s ease;
    }

    .review-item.show { opacity: 1; transform: translateX(0); }

    .review-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 3px;
    }

    .review-stars { display: flex; gap: 2px; margin-bottom: 5px; }
    .rev-star { font-size: 12px; color: rgba(255,255,255,0.2); }
    .rev-star.f { color: var(--gold); }

    .review-text { font-size: 13px; color: var(--subtext); line-height: 1.5; }

    /* Spice */
    .spice-bar { display: flex; gap: 8px; margin-top: 6px; }

    .spice-seg {
      flex: 1;
      height: 10px;
      border-radius: 5px;
      background: rgba(255,255,255,0.1);
      transition: background 0.4s;
    }

    .spice-seg.h { background: #ff5252; }
    .spice-seg.m { background: #FFA500; }
    .spice-text { font-size: 12px; color: var(--subtext); margin-top: 6px; }

    /* Ingredients */
    .ing-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .ing-tag {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.3s ease;
    }

    .ing-tag.show { opacity: 1; transform: scale(1); }

    /* Description */
    .desc-text {
      color: var(--subtext);
      font-size: 14px;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="load-emoji">🍽️</div>
    <div class="load-text">Preparing your dish...</div>
    <div class="load-bar"><div class="load-bar-fill"></div></div>
  </div>

  <a class="back-btn" href="index.html">← Menu</a>

  <!-- Photo -->
  <div class="photo-wrap" id="photo-wrap">
    <img class="dish-photo" id="dish-photo" src="" alt=""/>
    <div class="photo-gradient"></div>
    <div id="photo-badges" class="photo-badges"></div>
  </div>

  <!-- Content -->
  <div class="content">

    <div class="dish-name" id="dish-name"></div>

    <div class="badges-row" id="badges-row"></div>

    <!-- Price -->
    <div class="info-card" id="card-price">
      <div class="card-label">💰 Price</div>
      <div class="price-val"><span>₹</span><span id="price-val">0</span></div>
    </div>

    <!-- Rating -->
    <div class="info-card" id="card-rating">
      <div class="card-label">⭐ Rating & Reviews</div>
      <div class="rating-big">
        <div class="rating-num" id="rating-num">0</div>
        <div class="rating-right">
          <div class="stars-big" id="stars-big"></div>
          <div class="rating-count-big" id="rating-count"></div>
        </div>
      </div>
      <div id="reviews-list"></div>
    </div>

    <!-- Spice -->
    <div class="info-card" id="card-spice">
      <div class="card-label">🌶️ Spice Level</div>
      <div class="spice-bar" id="spice-bar"></div>
      <div class="spice-text" id="spice-text"></div>
    </div>

    <!-- Ingredients -->
    <div class="info-card" id="card-ingredients">
      <div class="card-label">🥘 Ingredients</div>
      <div class="ing-grid" id="ing-grid"></div>
    </div>

    <!-- Description -->
    <div class="info-card" id="card-desc">
      <div class="card-label">📖 About This Dish</div>
      <div class="desc-text" id="desc-text"></div>
    </div>

  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var dishId = parseInt(params.get('id'));
    var spiceNames = ['No Spice', 'Mild', 'Medium', 'Spicy', 'Very Spicy', 'Extra Hot 🔥'];

    function countUp(target) {
      var cur = 0;
      var step = target / 40;
      var t = setInterval(function() {
        cur += step;
        if (cur >= target) { cur = target; clearInterval(t); }
        document.getElementById('price-val').textContent = Math.floor(cur);
      }, 16);
    }

    function buildStarsBig(r) {
      var h = '';
      for (var i = 1; i <= 5; i++) {
        h += '<span class="star-big' + (i <= Math.round(r) ? ' filled' : '') + '">★</span>';
      }
      return h;
    }

    function buildSpiceBar(level) {
      var h = '';
      var cls = level <= 2 ? 'm' : 'h';
      for (var i = 1; i <= 5; i++) {
        h += '<div class="spice-seg' + (i <= level ? ' ' + cls : '') + '"></div>';
      }
      document.getElementById('spice-bar').innerHTML = h;
      document.getElementById('spice-text').textContent =
        level === 0 ? 'No spice' : spiceNames[level] || 'Spicy';
    }

    function createParticles() {
      var wrap = document.getElementById('photo-wrap');
      var colors = ['#FFD700','#FFA500','#FF6B35','#fff'];
      for (var i = 0; i < 12; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        var size = 4 + Math.random() * 6;
        p.style.cssText = [
          'width:' + size + 'px',
          'height:' + size + 'px',
          'left:' + (10 + Math.random() * 80) + '%',
          'bottom:' + (10 + Math.random() * 30) + '%',
          'background:' + colors[Math.floor(Math.random() * colors.length)],
          'animation-delay:' + (Math.random() * 3) + 's',
          'animation-duration:' + (2 + Math.random() * 2) + 's'
        ].join(';');
        wrap.appendChild(p);
      }
    }

    function showCard(id, delay) {
      setTimeout(function() {
        var el = document.getElementById(id);
        if (el) el.classList.add('show');
      }, delay);
    }

    fetch('menu.json')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var dish = data.dishes.find(function(d) { return d.id === dishId; });
        if (!dish) { window.location.href = 'index.html'; return; }

        // Photo
        document.getElementById('dish-photo').src = dish.photo;
        document.getElementById('dish-photo').onerror = function() {
          this.src = 'https://placehold.co/400x290/2d0a4e/FFD700?text=🍽';
        };

        // Photo badges
        var pb = '';
        if (dish.chef) pb += '<div class="badge-chef">👨‍🍳 CHEF\'S SPECIAL</div>';
        if (dish.bestseller) pb += '<div class="badge-best">⭐ BESTSELLER</div>';
        if (dish.isNew) pb += '<div class="badge-new">✨ NEW</div>';
        document.getElementById('photo-badges').innerHTML = pb;

        // Name
        document.getElementById('dish-name').textContent = dish.name;

        // Badges row
        var br = dish.type === 'veg'
          ? '<span class="veg-badge veg">🟢 VEG</span>'
          : '<span class="veg-badge nonveg">🔴 NON VEG</span>';
        br += '<span class="cat-tag">' + dish.category + '</span>';
        document.getElementById('badges-row').innerHTML = br;

        // Stars
        document.getElementById('stars-big').innerHTML = buildStarsBig(dish.rating);
        document.getElementById('rating-num').textContent = dish.rating.toFixed(1);
        document.getElementById('rating-count').textContent =
          dish.reviews + ' reviews';

        // Reviews
        var revHtml = '';
        if (dish.reviewsList && dish.reviewsList.length) {
          dish.reviewsList.forEach(function(rev) {
            var stars = '';
            for (var i = 1; i <= 5; i++) {
              stars += '<span class="rev-star' + (i <= rev.stars ? ' f' : '') + '">★</span>';
            }
            revHtml += '<div class="review-item">' +
              '<div class="review-name">' + rev.name + '</div>' +
              '<div class="review-stars">' + stars + '</div>' +
              '<div class="review-text">' + rev.comment + '</div>' +
            '</div>';
          });
        }
        document.getElementById('reviews-list').innerHTML = revHtml;

        // Spice
        buildSpiceBar(dish.spice);

        // Ingredients
        var ings = dish.ingredients.split(',').map(function(i) { return i.trim(); });
        document.getElementById('ing-grid').innerHTML =
          ings.map(function(i) {
            return '<span class="ing-tag">' + i + '</span>';
          }).join('');

        // Description
        document.getElementById('desc-text').textContent = dish.description;

        // Hide loading and animate
        setTimeout(function() {
          document.getElementById('loading-screen').style.display = 'none';

          setTimeout(function() {
            document.getElementById('photo-wrap').classList.add('show');
            createParticles();
          }, 80);

          setTimeout(function() {
            document.getElementById('dish-name').classList.add('show');
          }, 350);

          setTimeout(function() {
            document.getElementById('badges-row').classList.add('show');
          }, 500);

          showCard('card-price', 600);
          setTimeout(countUp.bind(null, dish.price), 700);
          showCard('card-rating', 750);

          // Animate reviews
          setTimeout(function() {
            document.querySelectorAll('.review-item').forEach(function(r, i) {
              setTimeout(function() { r.classList.add('show'); }, i * 150);
            });
          }, 900);

          showCard('card-spice', 900);
          showCard('card-ingredients', 1050);

          // Animate ingredients
          setTimeout(function() {
            document.querySelectorAll('.ing-tag').forEach(function(t, i) {
              setTimeout(function() { t.classList.add('show'); }, i * 80);
            });
          }, 1200);

          showCard('card-desc', 1200);

        }, 1100);
      })
      .catch(function() { window.location.href = 'index.html'; });
  </script>

</body>
  </html>
